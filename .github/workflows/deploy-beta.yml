# Construye el sitio de Astro (web/) y deja el build en la rama beta-dist.
#
# GoDaddy no acepta conexiones SSH desde GitHub (el rsync daba timeout), así
# que el servidor jala los cambios: un cron de cPanel hace fetch de beta-dist
# cada 5 minutos y actualiza la carpeta del subdominio. Ver web/DEPLOY.md.
#
# El beta lleva noindex para que Google no lo indexe junto al sitio real.

name: Desplegar beta

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy-beta.yml'
  workflow_dispatch:

concurrency:
  group: deploy-beta
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run build
      - run: npm run audit:seo

      - name: Marcar el beta como noindex
        run: |
          {
            echo ''
            echo '# Solo en beta: que no lo indexen los buscadores'
            echo '<IfModule mod_headers.c>'
            echo '    Header always set X-Robots-Tag "noindex, nofollow"'
            echo '</IfModule>'
          } >> dist/.htaccess
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt
          echo "${GITHUB_SHA}" > dist/version.txt

      - name: Publicar el build en la rama beta-dist
        run: |
          cd dist
          git init -q -b beta-dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Build de web/ desde ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" beta-dist
