# Revisa que la configuración de agentes siga en pie: skills espejo al día y
# el script de delegación sin errores. Ver tools/agentes/README.md.

name: Agentes

on:
  pull_request:
    paths:
      - '.agents/**'
      - '.claude/**'
      - 'tools/agentes/**'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '.github/workflows/agentes.yml'

permissions:
  contents: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/agentes/sincronizar-skills.py --check
      - run: python -m py_compile tools/agentes/*.py
      - run: python tools/agentes/delegar.py estado
      - name: El hook no estorba sin CODEX_REVIEW
        run: echo '{}' | python tools/agentes/delegar.py hook-stop
      - run: python -c "import json; json.load(open('.claude/settings.json'))"
      - name: Plantilla de CI igual a este workflow
        run: cmp tools/agentes/plantillas/agentes.yml .github/workflows/agentes.yml
